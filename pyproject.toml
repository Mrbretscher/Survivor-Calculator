[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "survivor-calculator"
version = "0.1.0"
description = "For-fun Survivor prediction and visualization pipeline."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
api = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]
ml = [
  "scikit-learn>=1.5",
]
dev = [
  "pytest>=8",
]

[project.scripts]
survivor-calculator = "survivor_calculator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

